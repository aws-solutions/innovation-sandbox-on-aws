        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /leases/shared:
    get:
      tags:
        - leases
      summary: List leases shared with a user
      description: >
        Returns leases the specified user has access to via direct user assignment or
        group-inherited access. The required `accessType` parameter selects between the
        two modes, which have different pagination strategies. Issue both in parallel
        and merge client-side for a complete picture.

        Authorization: Admin/Manager may specify any userId. Other callers must specify
        their own userId. M2M callers without Admin/Manager role are rejected with 403.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: IDC user ID to retrieve shared leases for
        - name: accessType
          in: query
          required: true
          schema:
            type: string
            enum: [direct, group]
          description: >
            `direct` — leases the user is assigned to individually (native DynamoDB pagination).
            `group` — leases assigned to IDC groups the user belongs to (bounded by group-assignment scan + BatchGetItem).
        - $ref: "#/components/parameters/PageIdentifier"
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
          description: >-
            Maximum number of leases per page (max 100). The legacy `pageSize`
            parameter is rejected as an unknown parameter on this endpoint.
      responses:
        "200":
          description: Paginated list of shared leases for the requested access type
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            type: array
                            items:
                              allOf:
                                - $ref: "#/components/schemas/Lease"
                                - type: object
                                  required:
                                    - accessType
                                  properties:
                                    accessType:
                                      type: string
                                      enum: [direct, group]
                                      description: How the user has access to this lease — directly assigned or via group membership
                                    sourceGroupName:
                                      type: string
                                      description: Display name of the IDC group granting access (present only when accessType is "group")
                          nextPageIdentifier:
                            type: string
                            nullable: true
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /leases/{leaseId}/assignments:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    get:
      tags:
        - leases
      summary: Get the reconciled principal assignment view for a lease
      description: >
        Returns the reconciled assignment view, computed server-side: the union of the lease's
        desired set and the live IDC access assignments, each annotated with a `syncStatus`.
        Both halves of the comparison are read in a single request, though not transactionally,
        so the comparison rule is applied in one place rather than by the client.

        Authorization: Admin/Manager can view any lease. Lease owner can view their own lease.
        Other users are rejected with 403.
      responses:
        "200":
          description: Reconciled assignment view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          assignments:
                            type: array
                            items:
                              $ref: "#/components/schemas/AssignmentView"
                          operationInProgress:
                            type: string
                            enum: [UPDATE, PUBLISH, FREEZE, UNFREEZE, TERMINATE]
                            description: >
                              Set while the Assignment Processor is reconciling this lease. Clients
                              use it to report progress and to decide whether to poll. Absent when
                              no live lock is held (an expired lock counts as none).
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags:
        - leases
      summary: Set desired principal assignments for a lease (full replacement)
      description: >
        Accepts the complete desired list of additional principals (excluding the owner).
        The backend auto-injects the lease owner into `desiredAssignments`, persists
        the full list atomically on the lease record, and publishes an AssignmentRequested
        event for async IDC processing. Principals absent from the list are removed.

        Returns 202 Accepted — IDC operations are processed asynchronously. Max 19
        additional principals (owner occupies 1 of the 20 total slots implicitly).

        Authorization: Admin/Manager always allowed. Lease owner requires
        `allowOwnerToShareLease: true` on the lease AND `leaseSharingEnabled: true` globally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assignments
              properties:
                assignments:
                  type: array
                  maxItems: 19
                  description: Desired list of additional principals (excluding the owner, who is implicit). Max 19 items.
                  items:
                    type: object
                    required:
                      - principalId
                      - principalType
                    properties:
                      principalId:
                        type: string
                        description: IDC user ID or group ID
                      principalType:
                        type: string
                        enum: [USER, GROUP]
      responses:
        "202":
          description: Desired state accepted and persisted. IDC operations are processed asynchronously.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          desiredCount:
                            type: integer
                            description: Total number of desired assignments persisted (including auto-injected owner)
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          description: Unauthorized, leaseSharingEnabled is false, or allowOwnerToShareLease is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          description: Lease is not in an Active status, or another assignment operation is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "500":
          $ref: "#/components/responses/ErrorResponse"

