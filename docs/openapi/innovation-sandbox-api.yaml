  # Configuration endpoints
  /configurations:
    get:
      tags:
        - configurations
      summary: Get all configuration sections
      description: >
        Returns all configuration sections merged with code defaults, plus read-only
        deploy-time fields (isbManagedRegions, awsAccessPortalUrl).
        Sections never saved to DynamoDB are returned with code defaults and lastSavedBy: null.
        Accessible by Admin, Manager, and User roles.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/GlobalConfiguration"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /configurations/{section}:
    parameters:
      - name: section
        in: path
        required: true
        schema:
          type: string
          enum:
            [
              leases,
              cleanup,
              notification,
              maintenance,
              termsOfService,
              costReporting,
            ]
        description: Configuration section name. Returns 404 for unknown values.
    get:
      tags:
        - configurations
      summary: Get a single configuration section
      description: >
        Returns one configuration section with its current values (or code defaults if
        never saved) and lastSavedBy audit field.
        Returns 404 if the section name is not recognised.
        Returns 500 if the stored record fails schema validation (fails fast, unlike GET /configurations which skips invalid sections).
        Accessible by Admin, Manager, and User roles.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Section fields plus lastSavedBy and meta
                        properties:
                          lastSavedBy:
                            type: string
                            nullable: true
                            description: Email of the last admin who saved this section, or null if never saved
                          meta:
                            $ref: "#/components/schemas/MetaData"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags:
        - configurations
      summary: Save a configuration section (full replacement)
      description: >
        Replaces an entire configuration section. All section fields are required.
        Uses optimistic concurrency: provide meta.lastEditTime from a prior GET to
        detect concurrent edits (returns 409 on conflict). Omit meta.lastEditTime on
        the first save for a section (uses attribute_not_exists condition).

        M2M callers are rejected with 403 — audit trail requires a human email identity.
        Admin role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                All fields for the section (required, no defaults applied server-side).
                Plus optional audit envelope for optimistic concurrency.
              properties:
                meta:
                  type: object
                  description: Optional optimistic concurrency envelope
                  properties:
                    lastEditTime:
                      type: string
                      format: date-time
                      description: Value from the prior GET response. Omit on first save.
              additionalProperties: true
              example:
                requireMaxBudget: true
                maxBudget: 100
                requireMaxDuration: true
                maxDurationHours: 168
                maxLeasesPerUser: 3
                ttl: 30
                allowUserLeaseTermination: true
                leaseRequestWindowHours: 168
                maxLeaseRequestsPerWindow: 10
                leaseSharingEnabled: false
                enablePrincipalSearch: true
                meta:
                  lastEditTime: "2026-04-04T12:30:00.000Z"
      responses:
        "200":
          description: Section saved successfully. Returns updated section with new lastEditTime and lastSavedBy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Updated section fields plus lastSavedBy and updated meta
                        properties:
                          lastSavedBy:
                            type: string
                            description: Email of the admin who saved this section
                          meta:
                            $ref: "#/components/schemas/MetaData"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Section not found (unknown section name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "409":
          description: Optimistic concurrency conflict — section was modified by another admin. Reload and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
              example:
                status: fail
                data:
                  errors:
                    - message: "Configuration was modified by another administrator. Reload to see the latest values."
        "500":
          $ref: "#/components/responses/ErrorResponse"

  # Principals endpoints
  /principals/search:
    get:
      tags:
        - principals
      summary: Search IAM Identity Center principals (typeahead)
      description: >
        Returns principals matching the search query from the DynamoDB cache.
        The cache is populated hourly by the Principal Cache Sync Lambda and contains
        only ISB group members (Users, Managers, Admins).
        Server-side case-insensitive contains match on displayName and email.

        Requires enablePrincipalSearch: true in global config (leases section).
        When disabled, all callers receive 403 — except exact=true lookups, which
        bypass the gate and perform JIT IDC resolution on cache miss.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Search query (case-insensitive contains on displayName/email). Min 2 chars recommended. Omit to list all cached principals up to limit.
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [users, groups, all]
            default: all
          description: Filter by principal type
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of results to return
        - name: exact
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
          description: >
            When "true", performs exact match lookup with JIT IDC fallback on cache miss.
            Requires type=users|groups (not "all") and a non-empty q.
            Bypasses the enablePrincipalSearch gate.
            Returns 404 if the principal is not found in either cache or IDC.
      responses:
        "200":
          description: Matching principals from cache (or exact JIT result)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - principals
                          - totalMatches
                        properties:
                          principals:
                            type: array
                            items:
                              $ref: "#/components/schemas/Principal"
                          totalMatches:
                            type: integer
                            description: Total matches before the limit was applied
                            example: 47
        "400":
          description: Bad request — invalid type parameter, or exact=true with type=all or empty q
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          description: Unauthorized, or enablePrincipalSearch is disabled (non-exact queries only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "404":
          description: Principal not found (exact=true only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
              example:
                status: fail
                data:
                  errors:
                    - message: "Principal not found in the identity store."
        "500":
          $ref: "#/components/responses/ErrorResponse"

  # Blueprint endpoints
  /blueprints/stacksets:
    get:
      tags:
        - blueprints
      summary: Discover available CloudFormation StackSets
      description: Lists active CloudFormation StackSets available in the ISB hub account that can be registered as blueprints
      parameters:
        - $ref: "#/components/parameters/PageIdentifier"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            type: array
                            items:
                              $ref: "#/components/schemas/AvailableStackSet"
                          nextPageIdentifier:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /blueprints:
    get:
      tags:
        - blueprints
      summary: Get list of all blueprints
      description: Returns all registered blueprints with their metadata and health metrics. Supports pagination for large result sets.
      parameters:
        - $ref: "#/components/parameters/PageIdentifier"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          blueprints:
                            type: array
                            items:
                              $ref: "#/components/schemas/Blueprint"
                          nextPageIdentifier:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - blueprints
      summary: Register a new blueprint
      description: Registers a CloudFormation StackSet as a blueprint by StackSet ID. The system automatically retrieves StackSet details from CloudFormation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - stackSetId
                - regions
              properties:
                name:
                  $ref: "#/components/schemas/BlueprintName"
                stackSetId:
                  $ref: "#/components/schemas/StackSetId"
                regions:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: AWS regions where the StackSet will be deployed
                  example: ["us-east-1", "us-west-2"]
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Optional key-value tags for the blueprint. Max 10 tags. Keys: 1-128 chars, alphanumeric and special chars, must not start with 'aws:'. Values: max 256 chars."
                  default: {}
                deploymentTimeoutMinutes:
                  $ref: "#/components/schemas/DeploymentTimeoutMinutes"
                regionConcurrencyType:
                  type: string
                  enum: [SEQUENTIAL, PARALLEL]
                  description: Whether StackSet operations run sequentially or in parallel across regions
                  default: SEQUENTIAL
                maxConcurrentPercentage:
                  type: integer
                  description: Maximum percentage of accounts in which to perform operations simultaneously
                  minimum: 1
                  maximum: 100
                failureTolerancePercentage:
                  type: integer
                  description: Percentage of accounts for which operations can fail before stopping
                  minimum: 0
                  maximum: 100
                concurrencyMode:
                  type: string
                  enum: [STRICT_FAILURE_TOLERANCE, SOFT_FAILURE_TOLERANCE]
                  description: Concurrency mode for StackSet operations
      responses:
        "201":
          description: Blueprint created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Blueprint"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: StackSet not found (may have been deleted or recreated with a different ID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
              example:
                status: fail
                data:
                  errors:
                    [
                      {
                        "message": "StackSet ID 'stackset-id' not found. If the StackSet was deleted and recreated, the blueprint must be deregistered and re-registered with the new StackSet ID.",
                      },
                    ]
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /blueprints/{blueprintId}:
    parameters:
      - $ref: "#/components/parameters/BlueprintId"
    get:
      tags:
        - blueprints
      summary: Get blueprint details
      description: Returns complete blueprint information including associated StackSets and metadata
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BlueprintWithStackSets"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags:
        - blueprints
      summary: Update blueprint metadata
      description: Updates mutable blueprint fields (name, tags, deploymentTimeoutMinutes, regionConcurrencyType) and StackSet deployment configuration (maxConcurrentPercentage, failureTolerancePercentage, concurrencyMode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/BlueprintName"
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: Key-value tags for the blueprint
                deploymentTimeoutMinutes:
                  $ref: "#/components/schemas/DeploymentTimeoutMinutes"
                regionConcurrencyType:
                  type: string
                  enum: [SEQUENTIAL, PARALLEL]
                  description: Whether StackSet operations run sequentially or in parallel across regions
                maxConcurrentPercentage:
                  type: integer
                  description: Maximum percentage of accounts in which to perform operations simultaneously
                  minimum: 1
                  maximum: 100
                failureTolerancePercentage:
                  type: integer
                  description: Percentage of accounts for which operations can fail before stopping
                  minimum: 0
                  maximum: 100
                concurrencyMode:
                  type: string
                  enum: [STRICT_FAILURE_TOLERANCE, SOFT_FAILURE_TOLERANCE]
                  description: Concurrency mode for StackSet operations
      responses:
        "200":
          description: Blueprint updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BlueprintWithStackSets"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags:
        - blueprints
      summary: Unregister a blueprint
      description: Deletes a blueprint if it is not currently attached to any lease templates
      responses:
        "200":
          description: Blueprint deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Blueprint unregistered successfully"
                          blueprintId:
                            $ref: "#/components/schemas/BlueprintUuid"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          description: Blueprint is in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
              example:
                status: fail
                data:
                  errors:
                    [
                      {
                        "message": "Cannot delete blueprint - currently attached to lease templates",
                      },
                    ]
        "500":
          $ref: "#/components/responses/ErrorResponse"
