openapi: 3.0.0
info:
  title: Innovation Sandbox on AWS
  description: API documentation for the Innovation Sandbox on AWS solution.
  version: 1.3.2
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: "{apiBaseUrl}"
    description: Base URL used to make API requests
    variables:
      apiBaseUrl:
        default: https://example.com/api
        description: Base URL used to make API requests
tags:
  - name: leases
    description: Contract that provides a user with temporary access to a sandbox account
  - name: leaseTemplates
    description: Configurations that can be used to request a sandbox lease
  - name: blueprints
    description: Pre-configured infrastructure templates that deploy CloudFormation StackSets to sandbox accounts
  - name: accounts
    description: AWS accounts registered as sandbox accounts within the solution
  - name: configurations
    description: Global configurations used by the solution
  - name: principals
    description: IAM Identity Center principal discovery for lease assignment
# Which credentials are required depends on the caller's IAM principal, which
# OpenAPI cannot express as a constraint. The two entries below are alternatives
# (a logical OR), so tooling will treat x-isb-identity as optional. It is not:
# human callers MUST send it, and M2M callers MUST omit it or be rejected with
# 400. See the isbIdentity scheme description.
security:
  - sigV4: []
    isbIdentity: [] # human callers (Identity Pool roles)
  - sigV4: [] # M2M callers (per-client assumed roles)
components:
  securitySchemes:
    sigV4:
      type: apiKey
      name: Authorization
      in: header
      x-amazon-apigateway-authtype: awsSigv4
      description: >-
        AWS Signature Version 4 over the `execute-api` service. Required on
        every request: the API uses IAM authorization
        (`AuthorizationType.IAM`), and there is no bearer-token or Cognito
        authorizer. The caller type is determined from the IAM principal.
    isbIdentity:
      type: apiKey
      name: x-isb-identity
      in: header
      description: >-
        Cognito ID token, verified via JWKS. Carries the claims used for RBAC.
        Required for human callers (Identity Pool roles). M2M callers (per-client
        assumed IAM roles) derive their role from the assumed-role ARN and must
        NOT send this header; a request presenting both an M2M principal and
        `x-isb-identity` is rejected with 400.
  schemas:
    ResponseBody:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
            - fail
            - error
      discriminator:
        propertyName: status
        mapping:
          success: "#/components/schemas/SuccessResponseBody"
          fail: "#/components/schemas/FailResponseBody"
          error: "#/components/schemas/ErrorResponseBody"
    SuccessResponseBody:
      allOf:
        - $ref: "#/components/schemas/ResponseBody"
        - type: object
          required:
            - status
            - data
          properties:
            status:
              type: string
              enum:
                - success
            data:
              type: object
    FailResponseBody:
      allOf:
        - $ref: "#/components/schemas/ResponseBody"
        - type: object
          required:
            - data
          properties:
            status:
              type: string
              enum:
                - fail
            data:
              type: object
    ErrorResponseBody:
      allOf:
        - $ref: "#/components/schemas/ResponseBody"
        - type: object
          required:
            - status
            - message
          properties:
            status:
              type: string
              enum:
                - error
            message:
              type: string
            code:
              type: number
            data:
              type: object
    PaginatedResults:
      type: object
      required:
        - result
      properties:
        result:
          type: array
        nextPageIdentifier:
          type: string
          example: "eyJsYXN0RXZhbHVhdGVkS2V5Ijp7InV1aWQiOnsicyI6IjEyMzQ1Njc4LTkwYWItY2RlZi0xMjM0LTU2Nzg5MGFiY2RlZiJ9fX0="
    AwsAccountId:
      type: string
      description: AWS account ID
      example: "123456789012"
    AccountStatus:
      type: string
      enum: [Available, Active, CleanUp, Quarantine, Frozen]
      description: Current status of the account
      example: "Available"
    DriftAtLastScan:
      type: boolean
      description: Whether drift was detected at the last scan
      example: false
    ThresholdAction:
      type: string
      enum: [ALERT, FREEZE_ACCOUNT]
      description: Action to take when threshold is reached
      example: ALERT
    BudgetThresholdDollarsSpent:
      type: number
      description: Threshold for budget notification
      example: 80
    DurationThresholdHoursRemaining:
      type: number
      description: Threshold for durations notification
      example: 12
    BudgetThresholds:
      type: array
      items:
        type: object
        properties:
          dollarsSpent:
            type: number
            description: Threshold for budget notification
            example: 80
          action:
            type: string
            description: Action to take when threshold is reached
            enum: [ALERT, FREEZE_ACCOUNT]
            example: ALERT
    DurationThresholds:
      type: array
      items:
        type: object
        properties:
          hoursRemaining:
            type: number
            description: Threshold for durations notification
            example: 12
          action:
            type: string
            description: Action to take when threshold is reached
            enum: [ALERT, FREEZE_ACCOUNT]
            example: ALERT
    Comments:
      type: string
      description: Comments about the lease
      example: "This is a comment"
    UserEmail:
      type: string
      format: email
      description: Email of the user who owns the lease
      example: "user@example.com"
    LeaseStatus:
      type: string
      enum:
        - PendingApproval
        - ApprovalDenied
        - Active
        - Frozen
        - Provisioning
        - Expired
        - BudgetExceeded
        - ManuallyTerminated
        - UserTerminated
        - AccountQuarantined
        - Ejected
        - ProvisioningFailed
      description: Current status of the lease
      example: "Active"
    LeaseUuid:
      type: string
      format: uuid
      description: Unique identifier for the lease
      example: "12345678-90ab-cdef-1234-567890abcdef"
    LeaseId:
      type: string
      description: Base64 encoded unique identifier for lease
      example: "BASE64STRING"
    LeaseTemplateUuid:
      type: string
      format: uuid
      description: Unique identifier for the lease template used to create the lease
      example: "12345678-90ab-cdef-1234-567890abcdef"
    LeaseTemplateName:
      type: string
      description: Name of the lease template
      example: Example Template
    LeaseTemplateDescription:
      type: string
      description: Description of the lease template
      example: Example Template Description
    LeaseDurationInHours:
      type: integer
      description: Duration of the lease in hours
      example: 24
    MaxSpend:
      type: number
      description: Maximum spend allowed for the lease
      example: 100
    StartDate:
      type: string
      format: date-time
      description: When the lease started
      example: "2025-01-15T08:30:00Z"
    ExpirationDate:
      type: string
      format: date-time
      description: When the lease is scheduled to expire
      example: "2025-01-22T08:30:00Z"
    EndDate:
      type: string
      format: date-time
      description: When the lease ended
      example: "2025-01-22T08:30:00Z"
    TotalCostAccrued:
      type: number
      description: Current cost accrued for this lease
      example: 45.67
    RequiresApproval:
      type: boolean
      description: Whether leases created from this template require approval
      example: true
    CreatedBy:
      type: string
      format: email
      description: Email of the user who created the template
      example: "admin@example.com"
    Visibility:
      type: string
      enum: [PUBLIC, PRIVATE]
      description: Visibility of the lease template - PUBLIC templates are visible to all users, PRIVATE templates are only visible to Admin and Manager roles
      example: "PUBLIC"
    CostReportGroup:
      type: string
      description: Cost report group identifier for cost allocation and reporting. Must be one of the values configured in costReportGroups if requireCostReportGroup is enabled.
      example: "Engineering"
      maxLength: 50
      nullable: true
    BlueprintUuid:
      type: string
      format: uuid
      description: Unique identifier for the blueprint
      example: "12345678-90ab-cdef-1234-567890abcdef"
    BlueprintName:
      type: string
      description: Name of the blueprint. Must start with a letter and contain only letters, numbers, and hyphens.
      example: "Web-Application-Blueprint"
      minLength: 1
      maxLength: 50
      pattern: "^[a-zA-Z][a-zA-Z0-9-]{0,49}$"
    StackSetName:
      type: string
      description: CloudFormation StackSet name
      example: "my-stackset"
      minLength: 1
    StackSetId:
      type: string
      description: Unique CloudFormation StackSet ID
      example: "12345678-1234-1234-1234-123456789012"
    AdministrationRoleArn:
      type: string
      description: ARN of the IAM role for StackSet administration
      example: "arn:aws:iam::123456789012:role/StackSetAdministrationRole"
    ExecutionRoleName:
      type: string
      description: Name of the IAM role for StackSet execution in target accounts
      example: "StackSetExecutionRole"
    DeploymentTimeoutMinutes:
      type: integer
      description: Timeout for blueprint deployment in minutes
      example: 60
      minimum: 5
      maximum: 480
      default: 30
    MetaData:
      type: object
      properties:
        createdTime:
          type: string
          format: date-time
          description: Time when the resource was created
          example: "2023-05-01T12:00:00Z"
        lastEditTime:
          type: string
          format: date-time
          description: Time when the resource was last edited
          example: "2023-05-01T12:00:00Z"
        schemaVersion:
          type: integer
          description: Version of the schema used to create the resource
          example: 1
    Account:
      type: object
      required:
        - awsAccountId
        - status
      properties:
        awsAccountId:
          $ref: "#/components/schemas/AwsAccountId"
        email:
          type: string
          format: email
          description: Email address associated with the AWS account
        name:
          type: string
          description: Friendly name of the account
          maxLength: 50
        status:
          $ref: "#/components/schemas/AccountStatus"
        driftAtLastScan:
          $ref: "#/components/schemas/DriftAtLastScan"
        cleanupExecutionContext:
          type: object
          description: Context for an in-progress cleanup execution
          properties:
            stateMachineExecutionArn:
              type: string
              description: ARN of the Step Functions execution performing cleanup
            stateMachineExecutionStartTime:
              type: string
              format: date-time
              description: When the cleanup execution started
        meta:
          $ref: "#/components/schemas/MetaData"
    UnregisteredAccount:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier (ID) of the account
        Email:
          type: string
          format: email
          description: The email address associated with the AWS account
        Name:
          type: string
          description: The friendly name of the account
    Lease:
      type: object
      required:
        - uuid
        - userEmail
        - status
        - originalLeaseTemplateUuid
        - originalLeaseTemplateName
      properties:
        userEmail:
          $ref: "#/components/schemas/UserEmail"
        uuid:
          $ref: "#/components/schemas/LeaseUuid"
        status:
          $ref: "#/components/schemas/LeaseStatus"
        originalLeaseTemplateUuid:
          $ref: "#/components/schemas/LeaseTemplateUuid"
        originalLeaseTemplateName:
          $ref: "#/components/schemas/LeaseTemplateName"
        leaseDurationInHours:
          $ref: "#/components/schemas/LeaseDurationInHours"
        maxSpend:
          $ref: "#/components/schemas/MaxSpend"
        budgetThresholds:
          $ref: "#/components/schemas/BudgetThresholds"
        durationThresholds:
          $ref: "#/components/schemas/DurationThresholds"
        comments:
          $ref: "#/components/schemas/Comments"
        costReportGroup:
          $ref: "#/components/schemas/CostReportGroup"
        blueprintId:
          type: string
          format: uuid
          nullable: true
          description: Blueprint attached to the lease template used for this lease
        blueprintName:
          type: string
          nullable: true
          description: Name of the attached blueprint
        createdBy:
          type: string
          format: email
          description: Email of the admin/manager who assigned the lease (only present for assigned leases)
        approvedBy:
          type: string
          description: Email of the approver or "AUTO_APPROVED" for auto-approved leases
          example: "admin@example.com"
        lastCheckedDate:
          type: string
          format: date-time
          description: When the lease was last checked by the monitoring system
        allowOwnerToShareLease:
          type: boolean
          description: Whether the lease owner can add/remove additional users. Denormalized from the lease template at creation time.
          example: false
        desiredAssignments:
          type: array
          description: Declarative list of desired principal assignments. Reflects the intended state; use GET /leases/{leaseId}/assignments for the reconciled view of this set against live IDC access.
          items:
            type: object
            properties:
              principalId:
                type: string
                description: IDC user ID or group ID
              principalType:
                type: string
                enum: [USER, GROUP]
              displayName:
                type: string
              email:
                type: string
                format: email
        resourceLock:
          type: object
          nullable: true
          description: >
            Concurrency-control lock held while assignment processing runs for this lease. Clients
            read it to gate lease actions. A lock whose `expiresAt` has passed is treated as absent.
          properties:
            ownerId:
              type: string
              description: Identifier of the operation holding the lock
            acquiredAt:
              type: string
              format: date-time
              description: When the lock was acquired
            expiresAt:
              type: string
              format: date-time
              description: When the lock expires; past this point the lock is treated as absent
            meta:
              type: object
              properties:
                intent:
                  type: string
                  enum: [UPDATE, PUBLISH, FREEZE, UNFREEZE, TERMINATE]
                  description: The operation the lock was taken for
        awsAccountId:
          $ref: "#/components/schemas/AwsAccountId"
        leaseId:
          $ref: "#/components/schemas/LeaseId"
        startDate:
          $ref: "#/components/schemas/StartDate"
        expirationDate:
          $ref: "#/components/schemas/ExpirationDate"
        endDate:
          $ref: "#/components/schemas/EndDate"
        totalCostAccrued:
          $ref: "#/components/schemas/TotalCostAccrued"
        meta:
          $ref: "#/components/schemas/MetaData"
    LeaseTemplate:
      type: object
      required:
        - uuid
        - name
        - requiresApproval
        - createdBy
      properties:
        uuid:
          $ref: "#/components/schemas/LeaseTemplateUuid"
        name:
          $ref: "#/components/schemas/LeaseTemplateName"
        description:
          $ref: "#/components/schemas/LeaseTemplateDescription"
        requiresApproval:
          $ref: "#/components/schemas/RequiresApproval"
        createdBy:
          $ref: "#/components/schemas/UserEmail"
        visibility:
          $ref: "#/components/schemas/Visibility"
        maxSpend:
          $ref: "#/components/schemas/MaxSpend"
        budgetThresholds:
          $ref: "#/components/schemas/BudgetThresholds"
        leaseDurationInHours:
          $ref: "#/components/schemas/LeaseDurationInHours"
        durationThresholds:
          $ref: "#/components/schemas/DurationThresholds"
        costReportGroup:
          $ref: "#/components/schemas/CostReportGroup"
        blueprintId:
          allOf:
            - $ref: "#/components/schemas/BlueprintUuid"
            - nullable: true
              description: Optional blueprint attached to this lease template
        blueprintName:
          type: string
          nullable: true
          description: Resolved name of the attached blueprint
        allowOwnerToShareLease:
          type: boolean
          description: Whether lease owners created from this template can manage additional user assignments
          example: false
        meta:
          $ref: "#/components/schemas/MetaData"
    StackSet:
      type: object
      required:
        - stackSetId
        - administrationRoleArn
        - executionRoleName
        - regions
      properties:
        blueprintId:
          $ref: "#/components/schemas/BlueprintUuid"
        stackSetId:
          $ref: "#/components/schemas/StackSetId"
        administrationRoleArn:
          $ref: "#/components/schemas/AdministrationRoleArn"
        executionRoleName:
          $ref: "#/components/schemas/ExecutionRoleName"
        regions:
          type: array
          items:
            type: string
          minItems: 1
          description: AWS regions where the StackSet will be deployed
          example: ["us-east-1", "us-west-2"]
        deploymentOrder:
          type: integer
          description: Deployment order for multi-StackSet blueprints
          example: 1
          default: 1
        maxConcurrentPercentage:
          type: integer
          description: Maximum percentage of accounts in which to perform StackSet operations simultaneously
          minimum: 1
          maximum: 100
          default: 100
        failureTolerancePercentage:
          type: integer
          description: Percentage of accounts for which StackSet operations can fail before the operation stops
          minimum: 0
          maximum: 100
          default: 0
        concurrencyMode:
          type: string
          enum: [STRICT_FAILURE_TOLERANCE, SOFT_FAILURE_TOLERANCE]
          description: Concurrency mode for StackSet operations
          default: STRICT_FAILURE_TOLERANCE
        healthMetrics:
          type: object
          properties:
            deploymentCount:
              type: integer
              description: Total number of deployments for this StackSet
            successfulDeploymentCount:
              type: integer
              description: Number of successful deployments
            lastFailureAt:
              type: string
              format: date-time
              description: Timestamp of last failed deployment
            lastSuccessAt:
              type: string
              format: date-time
              description: Timestamp of last successful deployment
            consecutiveFailures:
              type: integer
              description: Count of consecutive deployment failures
        meta:
          $ref: "#/components/schemas/MetaData"
    AvailableStackSet:
      type: object
      required:
        - stackSetName
        - stackSetId
      properties:
        stackSetName:
          $ref: "#/components/schemas/StackSetName"
        stackSetId:
          $ref: "#/components/schemas/StackSetId"
        description:
          type: string
          description: StackSet description
        status:
          type: string
          enum: [ACTIVE, DELETED]
          description: StackSet status
        permissionModel:
          type: string
          enum: [SELF_MANAGED, SERVICE_MANAGED]
          description: StackSet permission model
    Blueprint:
      type: object
      required:
        - blueprintId
        - name
        - createdBy
      properties:
        blueprintId:
          $ref: "#/components/schemas/BlueprintUuid"
        name:
          $ref: "#/components/schemas/BlueprintName"
        tags:
          type: object
          additionalProperties:
            type: string
          description: Key-value tags for the blueprint
          example:
            environment: "production"
            team: "platform"
        createdBy:
          $ref: "#/components/schemas/UserEmail"
        deploymentTimeoutMinutes:
          $ref: "#/components/schemas/DeploymentTimeoutMinutes"
        regionConcurrencyType:
          type: string
          enum: [SEQUENTIAL, PARALLEL]
          description: Whether StackSet operations run sequentially or in parallel across regions
          default: SEQUENTIAL
        totalHealthMetrics:
          type: object
          properties:
            totalDeploymentCount:
              type: integer
              description: Total deployments across all StackSets
            totalSuccessfulCount:
              type: integer
              description: Total successful deployments across all StackSets
            lastDeploymentAt:
              type: string
              format: date-time
              description: Timestamp of most recent deployment
        meta:
          $ref: "#/components/schemas/MetaData"
    BlueprintWithStackSets:
      type: object
      required:
        - blueprint
        - stackSets
      properties:
        blueprint:
          $ref: "#/components/schemas/Blueprint"
        stackSets:
          type: array
          items:
            $ref: "#/components/schemas/StackSet"
          description: StackSets associated with this blueprint
        recentDeployments:
          type: array
          items:
            type: object
            properties:
              stackSetId:
                type: string
              leaseId:
                type: string
                format: uuid
              accountId:
                type: string
              status:
                type: string
                enum: [RUNNING, SUCCEEDED, FAILED, QUEUED]
              operationId:
                type: string
              deploymentStartedAt:
                type: string
                format: date-time
              deploymentCompletedAt:
                type: string
                format: date-time
              duration:
                type: number
                description: Duration in minutes
              errorType:
                type: string
              errorMessage:
                type: string
          description: Recent deployment history entries (optional, with 90-day TTL)
    GlobalConfiguration:
      type: object
      required:
        - leases
        - cleanup
        - notification
        - maintenance
        - termsOfService
        - costReporting
        - isbManagedRegions
        - awsAccessPortalUrl
      properties:
        leases:
          type: object
          description: Lease policy configuration section
          properties:
            requireMaxBudget:
              type: boolean
            maxBudget:
              type: integer
              minimum: 0
            requireMaxDuration:
              type: boolean
            maxDurationHours:
              type: integer
              minimum: 0
            maxLeasesPerUser:
              type: integer
              minimum: 1
            ttl:
              type: integer
              minimum: 1
              description: Number of days the solution stores expired lease records before purging them
            allowUserLeaseTermination:
              type: boolean
              description: Whether users can self-terminate their own active leases
            leaseRequestWindowHours:
              type: integer
              minimum: 1
              description: Rolling window duration in hours for rate limiting lease requests
            maxLeaseRequestsPerWindow:
              type: integer
              minimum: 1
              description: Maximum number of leases a user can request within the rolling window
            leaseSharingEnabled:
              type: boolean
              description: Whether the multi-user lease sharing feature is globally enabled
            enablePrincipalSearch:
              type: boolean
              description: Whether the GET /principals/search typeahead API is available
            lastSavedBy:
              type: string
              nullable: true
              description: Email of the last admin who saved this section, or null if never saved (using defaults)
            meta:
              $ref: "#/components/schemas/MetaData"
        cleanup:
          type: object
          description: Account cleanup orchestration configuration section
          properties:
            numberOfFailedAttemptsToCancelCleanup:
              type: integer
              minimum: 1
            waitBeforeRetryFailedAttemptSeconds:
              type: integer
              minimum: 1
            numberOfSuccessfulAttemptsToFinishCleanup:
              type: integer
              minimum: 1
            waitBeforeRerunSuccessfulAttemptSeconds:
              type: integer
              minimum: 1
            validation:
              type: object
              properties:
                failureAction:
                  type: string
                  enum: [Quarantine, Warn, Silent]
                  description: Action when post-cleanup Resource Explorer validation finds remaining resources
            cooldownPeriodHours:
              type: integer
              minimum: 0
              maximum: 8640
              description: Hours to hold account in CleanUp OU after successful cleanup before returning to Available (0 = disabled, max 8640 = 360 days)
            reportRetentionDays:
              type: integer
              minimum: 14
              maximum: 3650
              description: Days to retain cleanup report records in DynamoDB
            lastSavedBy:
              type: string
              nullable: true
            meta:
              $ref: "#/components/schemas/MetaData"
        notification:
          type: object
          description: Email notification configuration section
          properties:
            emailFrom:
              type: string
              description: From address used for notification emails. Empty string disables notifications.
              example: "isb-noreply@example.com"
            lastSavedBy:
              type: string
              nullable: true
            meta:
              $ref: "#/components/schemas/MetaData"
        maintenance:
          type: object
          description: Maintenance mode configuration section
          properties:
            enabled:
              type: boolean
              description: When true, prevents creation of new leases. Fresh installs default to true.
            lastSavedBy:
              type: string
              nullable: true
            meta:
              $ref: "#/components/schemas/MetaData"
        termsOfService:
          type: object
          description: Terms of service configuration section
          properties:
            content:
              type: string
              maxLength: 10000
              description: Terms of service text displayed to users before requesting a lease
            lastSavedBy:
              type: string
              nullable: true
            meta:
              $ref: "#/components/schemas/MetaData"
        costReporting:
          type: object
          description: Cost reporting configuration section
          properties:
            costReportGroups:
              type: array
              items:
                type: string
                maxLength: 50
              maxItems: 100
              description: List of valid cost report group values for lease templates
            requireCostReportGroup:
              type: boolean
              description: Whether cost report group is required on lease templates
            lastSavedBy:
              type: string
              nullable: true
            meta:
              $ref: "#/components/schemas/MetaData"
        isbManagedRegions:
          type: array
          items:
            type: string
          minItems: 1
          description: AWS regions managed by Innovation Sandbox (read-only, resolved at deploy time)
          example: ["us-east-1", "us-west-2"]
        awsAccessPortalUrl:
          type: string
          format: uri
          description: The AWS Access Portal URL for IAM Identity Center SSO (read-only, resolved at deploy time)
    AssignmentView:
      type: object
      required:
        - principalId
        - principalType
        - displayName
        - isOwner
        - isDesired
        - syncStatus
      properties:
        principalId:
          type: string
          description: IDC user ID (for USER assignments) or group ID (for GROUP assignments)
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        principalType:
          type: string
          enum: [USER, GROUP]
          description: Whether this is a direct user or group assignment
        assigneeEmail:
          type: string
          format: email
          description: Email address of the assigned user (USER assignments only)
        displayName:
          type: string
          description: Display name of the principal (user's name for USER, group name for GROUP)
        addedBy:
          type: string
          format: email
          description: >
            Email of the user who created this assignment. Comes from the access record, so it is
            absent for a principal that is desired but not yet granted.
        addedDate:
          type: string
          format: date-time
          description: >
            Timestamp when this assignment was created. Comes from the access record, so it is
            absent for a principal that is desired but not yet granted.
        isOwner:
          type: boolean
          description: True for the lease owner, whose access is implicit and cannot be removed.
        isDesired:
          type: boolean
          description: >
            Whether the principal is in the lease's desired set. A record lingering after a failed
            revoke is present but NOT desired, and must be excluded when echoing this list back as
            the new desired state via PUT.
        syncStatus:
          type: string
          enum:
            [active, granting, revoking, suspended, grantFailed, revokeFailed]
          description: >
            Reconciliation status of this principal. Each in-flight state pairs with the failure
            it becomes if it never settles: granting -> grantFailed, revoking -> revokeFailed.
            `active` — desired and assigned.
            `granting` — desired, not yet assigned, an operation is in flight.
            `revoking` — assigned but on its way out.
            `suspended` — intentionally not assigned because the lease grants nobody access
            (frozen or terminal, or a freeze/terminate in flight); expected, not a failure.
            `grantFailed` — desired and settled, but no assignment exists.
            `revokeFailed` — settled, but an assignment exists that should not: either the
            principal is no longer desired, or the lease grants no access.
    Principal:
      type: object
      required:
        - principalId
        - principalType
        - displayName
      properties:
        principalId:
          type: string
          description: IDC user ID or group ID
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        principalType:
          type: string
          enum: [USER, GROUP]
          description: Whether this is a user or group
        displayName:
          type: string
          description: Display name of the user or group
          example: "Jane Doe"
        email:
          type: string
          format: email
          description: Email address (USER principals only)
          example: "jane@example.com"
    CleanupStatus:
      type: string
      description: >
        Current phase of the cleanup process. Known static values are listed; dynamic
        values matching NUKE_PHASE_\d+ (e.g. NUKE_PHASE_1, NUKE_PHASE_2) are also valid.
      pattern: "^(INITIALIZING|REVOKING_ACCESS|VALIDATING|COOLING_DOWN|COMPLETED|FAILED|NUKE_PHASE_\\d+)$"
      example: "NUKE_PHASE_1"
    CleanupReportStep:
      type: object
      required:
        - name
        - startedAt
      properties:
        name:
          type: string
          description: Name of the cleanup step
          example: "nuke-phase-1"
        startedAt:
          type: string
          format: date-time
          description: Timestamp when this step started
          example: "2026-03-25T14:30:00.000Z"
        codeBuildExecutionArn:
          type: string
          description: ARN of the CodeBuild execution for Nuke phases
          example: "arn:aws:codebuild:us-east-1:123456789012:build/isb-cleanup:abc123"
        cooldownDurationHours:
          type: number
          description: Configured cooldown duration in hours (cooldown step only)
          example: 24
        skippedBy:
          type: string
          format: email
          description: Email of the administrator who skipped the cooldown (populated only if skipped)
          example: "admin@example.com"
        skippedAt:
          type: string
          format: date-time
          description: Timestamp when the cooldown was skipped (populated only if skipped)
    CleanupResourceSummary:
      type: object
      properties:
        validationMode:
          type: string
          enum: [Silent, Warn, Quarantine]
          description: >-
            Validation mode in effect. Quarantine enforces (a failed validation
            quarantines the account); Warn surfaces remaining resources without
            blocking; Silent records metrics only. Absent if validation did not run.
          example: Quarantine
        beforeCleanup:
          type: object
          properties:
            totalCount:
              type: integer
              description: Total number of resources found before cleanup
              example: 42
            ignoredCount:
              type: integer
              description: Number of resources excluded by the validator exclusion config
              example: 5
            byType:
              type: object
              additionalProperties:
                type: integer
              description: Resource counts grouped by AWS resource type
              example:
                "ec2:instance": 3
                "s3:bucket": 2
                "logs:log-group": 12
        afterCleanup:
          type: object
          description: >-
            Post-nuke, pre-cooldown resource snapshot (metrics-only). Diffed
            against afterCooldown to detect Resource Explorer staleness:
            resources present here but gone after cooldown are index ghosts that
            cleared during cooldown (candidate stale resources).
          properties:
            totalCount:
              type: integer
              description: Total number of resources found immediately after nuke
              example: 6
            ignoredCount:
              type: integer
              description: Number of resources excluded by the validator exclusion config
              example: 5
            byType:
              type: object
              additionalProperties:
                type: integer
              description: Resource counts grouped by AWS resource type
              example:
                "ec2:instance": 1
        afterCooldown:
          type: object
          description: >-
            Post-cooldown resource snapshot — the enforcement/validation
            result. Non-empty byType (after exclusions) indicates a validation
            failure.
          properties:
            totalCount:
              type: integer
              description: Total number of resources found after cleanup and cooldown
              example: 0
            ignoredCount:
              type: integer
              description: Number of resources excluded by the validator exclusion config
              example: 5
            byType:
              type: object
              additionalProperties:
                type: integer
              description: Resource counts grouped by AWS resource type
              example: {}
        deletedTypes:
          type: array
          items:
            type: string
          description: Resource types that were successfully deleted
          example: ["ec2:instance", "s3:bucket", "logs:log-group"]
        remainingTypes:
          type: array
          items:
            type: string
          description: Resource types that remain after cleanup (non-empty indicates validation failure)
          example: []
    CleanupReport:
      type: object
      required:
        - accountId
        - status
        - cleanupStatus
        - startedAt
        - reasonForCleanup
        - steps
        - meta
      properties:
        accountId:
          $ref: "#/components/schemas/AwsAccountId"
        durableExecutionArn:
          type: string
          description: ARN of the Lambda durable execution orchestrating this cleanup
          example: "arn:aws:lambda:us-east-1:123456789012:function:ISB-DurableOrchestration:1/durable-execution/abc123"
        status:
          type: string
          enum: [IN_PROGRESS, COMPLETED, FAILED]
          description: Overall status of the cleanup report
          example: "COMPLETED"
        cleanupStatus:
          $ref: "#/components/schemas/CleanupStatus"
        startedAt:
          type: string
          format: date-time
          description: Timestamp when the cleanup started
          example: "2026-03-25T14:30:00.000Z"
        completedAt:
          type: string
          format: date-time
          description: Timestamp when the cleanup completed (absent if still in progress)
          example: "2026-03-25T15:45:00.000Z"
        reasonForCleanup:
          type: string
          enum:
            - LEASE_TERMINATION
            - ACCOUNT_REGISTRATION
            - RETRY_FAILED_CLEANUP
            - LEASE_RESET
          description: What triggered this cleanup
          example: "LEASE_TERMINATION"
        resourceSummary:
          $ref: "#/components/schemas/CleanupResourceSummary"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/CleanupReportStep"
          description: >
            Append-only list of steps in the cleanup flow. The end time of each step
            is inferred as the startedAt of the next step. The last entry represents
            the currently-in-progress step for active cleanups.
        error:
          type: object
          properties:
            step:
              type: string
              description: Name of the step that failed
              example: "validate-spoke-role"
            message:
              type: string
              description: Error message
              example: "Cleanup spoke role not found"
        meta:
          $ref: "#/components/schemas/MetaData"
  parameters:
    PageIdentifier:
      name: pageIdentifier
      in: query
      required: false
      schema:
        type: string
      description: Base64 encoded token for pagination
    MaxResults:
      name: maxResults
      in: query
      required: false
      schema:
        type: integer
      description: >-
        Maximum number of items to return per page. The legacy `pageSize`
        parameter is unsupported: most endpoints ignore it and apply their
        default, while `/leases/shared` rejects it as an unknown parameter.
    UserEmail:
      name: userEmail
      description: Filter leases by user email
      in: query
      required: false
      schema:
        type: string
        format: email
    LeaseId:
      name: leaseId
      description: Base64 encoded unique identifier for lease
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/LeaseId"
    LeaseTemplateIdPathParam:
      name: leaseTemplateName
      description: >-
        Lease template UUID. The path segment is named `leaseTemplateName` in the
        API Gateway definition, but the value is the template's UUID, not its
        display name.
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/LeaseTemplateUuid"
    BlueprintId:
      name: blueprintId
      description: UUID for blueprint
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BlueprintUuid"
    AwsAccountId:
      name: awsAccountId
      description: AWS account ID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AwsAccountId"
  responses:
    BadRequestResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailResponseBody"
          example:
            status: fail
            data:
              errors: [{ "message": "example error message" }]
    UnauthenticatedResponse:
      description: >-
        Unauthenticated. The `x-isb-identity` ID token is missing, expired,
        invalid, or lacks required claims.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailResponseBody"
          example:
            status: fail
            data:
              errors:
                [
                  {
                    "message": "Token is missing required claims. Please re-authenticate.",
                  },
                ]
    UnauthorizedResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailResponseBody"
          example:
            message: Unauthorized
    ResourceNotFoundResponse:
      description: Resource Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailResponseBody"
          example:
            status: fail
            data:
              errors: [{ "message": "example error message" }]
    ConflictResponse:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailResponseBody"
          example:
            status: fail
            data:
              errors: [{ "message": "example error message" }]
    ErrorResponse:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponseBody"
          example:
            status: error
            message: "An unexpected error occurred"
paths:
  # Lease endpoints
  /leases:
    get:
      tags:
        - leases
      summary: Get paginated list of all leases
      parameters:
        - $ref: "#/components/parameters/PageIdentifier"
        - $ref: "#/components/parameters/MaxResults"
        - $ref: "#/components/parameters/UserEmail"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PaginatedResults"
                          - type: object
                            properties:
                              result:
                                type: array
                                items:
                                  allOf:
                                    - $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - leases
      summary: Request a new lease
      description: "Request a new lease for the authenticated user or, if userEmail is provided and the user has Admin/Manager permissions, for another user. The target user must exist in AWS Identity Center."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - leaseTemplateUuid
              properties:
                leaseTemplateUuid:
                  $ref: "#/components/schemas/LeaseTemplateUuid"
                comments:
                  $ref: "#/components/schemas/Comments"
                userEmail:
                  $ref: "#/components/schemas/UserEmail"
                  description: "Optional email of the user to create the lease for. Only Admin/Manager roles can create leases for other users. If not provided, the lease will be created for the authenticated user."
                assignments:
                  type: array
                  maxItems: 19
                  description: >
                    Optional initial principal assignments (in addition to the lease owner).
                    Requires leaseSharingEnabled globally and allowOwnerToShareLease on the template (for non-Admin/Manager callers).
                    Max 19 entries (owner occupies 1 of the 20 total slots).
                  items:
                    type: object
                    required:
                      - principalId
                      - principalType
                    properties:
                      principalId:
                        type: string
                        description: IDC user ID or group ID
                      principalType:
                        type: string
                        enum: [USER, GROUP]
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "429":
          description: Too Many Requests — lease request rate limit exceeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FailResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                message:
                                  type: string
                          retryAt:
                            type: string
                            format: date-time
                            description: ISO 8601 timestamp indicating when the user may next request a lease
              example:
                status: fail
                data:
                  errors:
                    - message: "You have reached the maximum number of lease requests allowed within the rolling window."
                  retryAt: "2026-04-27T15:42:00Z"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leases/{leaseId}:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    get:
      tags:
        - leases
      summary: Get lease by lease id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        type: object
                        allOf:
                          - $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags:
        - leases
      summary: Update lease by lease id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxSpend:
                  $ref: "#/components/schemas/MaxSpend"
                budgetThresholds:
                  $ref: "#/components/schemas/BudgetThresholds"
                expirationDate:
                  $ref: "#/components/schemas/ExpirationDate"
                durationThresholds:
                  $ref: "#/components/schemas/DurationThresholds"
                costReportGroup:
                  $ref: "#/components/schemas/CostReportGroup"
                allowOwnerToShareLease:
                  type: boolean
                  description: >
                    Admin/Manager only. Enable or disable owner-managed user sharing for this lease.
                    Rejected with 400 when leaseSharingEnabled is globally false.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Lease"

        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leases/{leaseId}/review:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags:
        - leases
      summary: Review (approve or deny) a pending lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [Approve, Deny]
                  description: Action to take on the pending lease
                  example: Approve
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leases/{leaseId}/freeze:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags:
        - leases
      summary: Freeze an active lease
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          description: >
            Lease is not in a monitored status, or a lock conflict. Freeze is blocked by an
            in-flight TERMINATE or FREEZE; it preempts an in-flight UPDATE, PUBLISH, or UNFREEZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leases/{leaseId}/terminate:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags:
        - leases
      summary: Terminate an active lease
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          description: >
            Lease is not in a monitored status, or a lock conflict. Terminate is blocked only by
            an in-flight TERMINATE; it preempts every other intent, including FREEZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leases/{leaseId}/unfreeze:
    parameters:
      - $ref: "#/components/parameters/LeaseId"
    post:
      tags:
        - leases
      summary: Unfreeze a frozen lease
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "409":
          description: >
            Lease is not in a Frozen status, or a lock conflict. Unfreeze is non-critical, so any
            live lock blocks it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailResponseBody"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  # Lease Template endpoints
  /leaseTemplates:
    get:
      tags:
        - leaseTemplates
      summary: Get paginated list of lease templates
      description: Returns all lease templates visible to the current user. Users with Admin or Manager roles can see all templates (PUBLIC and PRIVATE), while regular users can only see PUBLIC templates.
      parameters:
        - $ref: "#/components/parameters/PageIdentifier"
        - $ref: "#/components/parameters/MaxResults"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/PaginatedResults"
                          - type: object
                            properties:
                              result:
                                type: array
                                items:
                                  $ref: "#/components/schemas/LeaseTemplate"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - leaseTemplates
      summary: Create new lease template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - requiresApproval
              properties:
                name:
                  $ref: "#/components/schemas/LeaseTemplateName"
                description:
                  $ref: "#/components/schemas/LeaseTemplateDescription"
                visibility:
                  $ref: "#/components/schemas/Visibility"
                maxSpend:
                  $ref: "#/components/schemas/MaxSpend"
                leaseDurationInHours:
                  $ref: "#/components/schemas/LeaseDurationInHours"
                budgetThresholds:
                  $ref: "#/components/schemas/BudgetThresholds"
                durationThresholds:
                  $ref: "#/components/schemas/DurationThresholds"
                requiresApproval:
                  type: boolean
                  example: true
                  description: Whether leases created from this template require approval
                costReportGroup:
                  $ref: "#/components/schemas/CostReportGroup"
                blueprintId:
                  allOf:
                    - $ref: "#/components/schemas/BlueprintUuid"
                    - nullable: true
                      description: Optional blueprint to attach to this lease template
                allowOwnerToShareLease:
                  type: boolean
                  description: Whether owners of leases created from this template can manage additional user assignments
                  example: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/LeaseTemplate"

        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /leaseTemplates/{leaseTemplateName}:
    parameters:
      - $ref: "#/components/parameters/LeaseTemplateIdPathParam"
    get:
      tags:
        - leaseTemplates
      summary: Get lease template by id
      description: Returns a specific lease template by ID. Users with Admin or Manager roles can access any template, while regular users can only access PUBLIC templates. Attempting to access a PRIVATE template as a regular user will return a 404 Resource Not Found.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponseBody"
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/LeaseTemplate"
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
        "403":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/ResourceNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags:
        - leaseTemplates
      summary: Update lease template by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - requiresApproval
              properties:
                name:
                  type: string
                description:
                  type: string
                visibility:
                  $ref: "#/components/schemas/Visibility"
                requiresApproval:
                  type: boolean
                maxSpend:
                  $ref: "#/components/schemas/MaxSpend"
                leaseDurationInHours:
                  $ref: "#/components/schemas/LeaseDurationInHours"
                budgetThresholds:
                  $ref: "#/components/schemas/BudgetThresholds"
                durationThresholds:
                  $ref: "#/components/schemas/DurationThresholds"
